  <g class="late"><circle cx="817.5" cy="220.7" r="4.5" fill="#A33A2B"/>
    <text x="827.5" y="238.7" class="mono" font-size="12" fill="#4A5058" text-anchor="start" font-weight="400" >4 h: 0.47</text>
  <circle cx="1070.8" cy="131.0" r="4.5" fill="#A33A2B"/>
    <text x="1062.8" y="119.0" class="mono" font-size="12" fill="#4A5058" text-anchor="end" font-weight="400" >0.9 at 14.4 h</text>
  </g>
</svg>
