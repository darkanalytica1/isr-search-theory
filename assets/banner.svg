<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">ISR search theory</title>
  <desc id="d">Banner. Probability of detection under Koopman's random-search law rises with hours on task and flattens: 0.47 after 4 hours and 0.9 only after 14.4 hours in a 2,000 square nautical mile box.</desc>
  <style>
    .serif { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.08em; fill: #7A8088; }

    .draw { stroke-dasharray: 451; stroke-dashoffset: 0; animation: draw 8s ease-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 451; } 70% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
    .late { opacity: 1; animation: late 8s linear infinite; }
    @keyframes late { 0% { opacity: 0; } 45% { opacity: 0; } 55% { opacity: 1; } 100% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
  <rect width="1200" height="400" fill="#F6F4EF"/>
  <text x="64.0" y="84.0" class="mono" font-size="13" fill="#7A8088" text-anchor="start" font-weight="400" letter-spacing="0.12em">DARKANALYTICA</text>
  <rect x="64" y="112" width="56" height="3" fill="#1F3A5F"/>
  <text x="64.0" y="180.0" class="serif" font-size="46" fill="#1B1F24" text-anchor="start" font-weight="600" >ISR Search Theory</text>
  <text x="64.0" y="236.0" class="sans" font-size="19" fill="#4A5058" text-anchor="start" font-weight="400" >Finding comes before identifying. Sweep</text>
  <text x="64.0" y="264.0" class="sans" font-size="19" fill="#4A5058" text-anchor="start" font-weight="400" >width, coverage and probability of detection</text>
  <text x="64.0" y="292.0" class="sans" font-size="19" fill="#4A5058" text-anchor="start" font-weight="400" >as a planner would compute them.</text>
  <text x="64.0" y="352.0" class="mono" font-size="13" fill="#7A8088" text-anchor="start" font-weight="400" >POD = 1 − exp(−W·L / A)</text>
  <text x="720.0" y="92.0" class="mono" font-size="12" fill="#7A8088" text-anchor="start" font-weight="400" letter-spacing="0.06em">POD · 2,000 NM² · W = 4 NM · 80 kt</text>
  <line x1="720" y1="320" x2="1110" y2="320" stroke="#DAD6CC" stroke-width="1.5"/>
  <line x1="720" y1="110" x2="720" y2="320" stroke="#DAD6CC" stroke-width="1.5"/>
  <text x="720.0" y="342.0" class="mono" font-size="12" fill="#7A8088" text-anchor="middle" font-weight="400" >0 h</text>
  <text x="817.5" y="342.0" class="mono" font-size="12" fill="#7A8088" text-anchor="middle" font-weight="400" >4 h</text>
  <text x="915.0" y="342.0" class="mono" font-size="12" fill="#7A8088" text-anchor="middle" font-weight="400" >8 h</text>
  <text x="1012.5" y="342.0" class="mono" font-size="12" fill="#7A8088" text-anchor="middle" font-weight="400" >12 h</text>
  <text x="1110.0" y="342.0" class="mono" font-size="12" fill="#7A8088" text-anchor="middle" font-weight="400" >16 h</text>
  <text x="710.0" y="219.0" class="mono" font-size="12" fill="#7A8088" text-anchor="end" font-weight="400" >0.5</text>
  <text x="710.0" y="114.0" class="mono" font-size="12" fill="#7A8088" text-anchor="end" font-weight="400" >1.0</text>
