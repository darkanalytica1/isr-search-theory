<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d">
  <title id="t">The search-to-identify chain</title>
  <desc id="d">A candidate is found by a wide-area search layer, detected, cross-cued to a narrow sensor, identified and held as a track. If contact is lost the uncertainty area grows with the square of the gap and the chain returns to search.</desc>
  <style>
    .serif { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.08em; fill: #7A8088; }
    @keyframes travel {
      0.00% { transform: translate(110.0px, 120.0px); }
      9.85% { transform: translate(305.0px, 120.0px); }
      19.70% { transform: translate(500.0px, 120.0px); }
      29.55% { transform: translate(695.0px, 120.0px); }
      39.39% { transform: translate(890.0px, 120.0px); }
      50.00% { transform: translate(890.0px, 330.0px); }
      69.70% { transform: translate(500.0px, 330.0px); }
      89.39% { transform: translate(110.0px, 330.0px); }
      100.00% { transform: translate(110.0px, 120.0px); }
    }

    .dot { animation: travel 10.0s linear infinite; transform: translate(110px, 120px); }
    .pulse { opacity: 0; animation: pulse 10.0s linear infinite; }
    @keyframes pulse { 0% { opacity: 0; } 2% { opacity: 1; } 12% { opacity: 0; } 100% { opacity: 0; } }
    .grow { transform-box: fill-box; transform-origin: center; animation: grow 10.0s ease-in infinite; animation-delay: 4.80s; opacity: 0.9; }
    @keyframes grow {
      0% { transform: scale(0.25); opacity: 0; } 3% { opacity: 0.9; }
      30% { transform: scale(1); opacity: 0.9; } 45% { transform: scale(1); opacity: 0; } 100% { transform: scale(1); opacity: 0; }
    }
    .flow { stroke-dasharray: 6 8; animation: flow 3s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .p0 { animation-delay: -0.10s; }
    .p1 { animation-delay: 0.88s; }
    .p2 { animation-delay: 1.87s; }
    .p3 { animation-delay: 2.85s; }
    .p4 { animation-delay: 3.84s; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
  <rect width="1000" height="470" fill="#F6F4EF"/>
  <path d="M 110 120 L 890 120" stroke="#5B7083" stroke-width="1.75" class="flow" fill="none"/>
  <path d="M 890 120 L 890 330 L 110 330 L 110 120" stroke="#A33A2B" stroke-width="1.5" stroke-dasharray="5 6" fill="none" opacity="0.8"/>
  <circle cx="890" cy="330" r="22" fill="none" stroke="#A33A2B" stroke-width="1.25" opacity="0.5"/>
  <circle class="grow" cx="890" cy="330" r="58" fill="#F6E9E6" fill-opacity="0.5" stroke="#A33A2B" stroke-width="1.5"/>
  <g class="dot"><circle r="7" fill="#1F3A5F"/><circle r="12" fill="none" stroke="#1F3A5F" stroke-width="1" opacity="0.35"/></g>
  <g class="">
    <rect x="22.0" y="74.0" width="176" height="92" rx="4" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.5"/>
    <rect x="22.0" y="74.0" width="176" height="3" rx="1.5" fill="#1F3A5F"/>
    <text x="110.0" y="100.0" class="sans" font-size="15" fill="#1B1F24" text-anchor="middle" font-weight="600" >Search</text>
    <text x="110.0" y="120.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >wide-area layer</text>
    <text x="110.0" y="137.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >Ȧ = W·v</text>
  </g>
  <rect class="pulse p0" x="18.0" y="70.0" width="184" height="100" rx="6" fill="none" stroke="#1F3A5F" stroke-width="2"/>
  <g class="">
    <rect x="217.0" y="74.0" width="176" height="92" rx="4" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.5"/>
    <rect x="217.0" y="74.0" width="176" height="3" rx="1.5" fill="#1F3A5F"/>
    <text x="305.0" y="100.0" class="sans" font-size="15" fill="#1B1F24" text-anchor="middle" font-weight="600" >Detect</text>
    <text x="305.0" y="120.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >candidate + error</text>
    <text x="305.0" y="137.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >PPV · review s</text>
  </g>
  <rect class="pulse p1" x="213.0" y="70.0" width="184" height="100" rx="6" fill="none" stroke="#1F3A5F" stroke-width="2"/>
  <g class="">
    <rect x="412.0" y="74.0" width="176" height="92" rx="4" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.5"/>
    <rect x="412.0" y="74.0" width="176" height="3" rx="1.5" fill="#1F3A5F"/>
    <text x="500.0" y="100.0" class="sans" font-size="15" fill="#1B1F24" text-anchor="middle" font-weight="600" >Cross-cue</text>
    <text x="500.0" y="120.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >slew · settle</text>
    <text x="500.0" y="137.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >search error circle</text>
  </g>
  <rect class="pulse p2" x="408.0" y="70.0" width="184" height="100" rx="6" fill="none" stroke="#1F3A5F" stroke-width="2"/>
  <g class="">
    <rect x="607.0" y="74.0" width="176" height="92" rx="4" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.5"/>
    <rect x="607.0" y="74.0" width="176" height="3" rx="1.5" fill="#1F3A5F"/>
    <text x="695.0" y="100.0" class="sans" font-size="15" fill="#1B1F24" text-anchor="middle" font-weight="600" >Identify</text>
    <text x="695.0" y="120.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >narrow sensor</text>
    <text x="695.0" y="137.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >Q_ID</text>
  </g>
  <rect class="pulse p3" x="603.0" y="70.0" width="184" height="100" rx="6" fill="none" stroke="#1F3A5F" stroke-width="2"/>
  <g class="">
    <rect x="802.0" y="74.0" width="176" height="92" rx="4" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.5"/>
    <rect x="802.0" y="74.0" width="176" height="3" rx="1.5" fill="#1F3A5F"/>
    <text x="890.0" y="100.0" class="sans" font-size="15" fill="#1B1F24" text-anchor="middle" font-weight="600" >Track</text>
    <text x="890.0" y="120.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >custody to handover</text>
    <text x="890.0" y="137.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >revisit &lt; gap</text>
  </g>
  <rect class="pulse p4" x="798.0" y="70.0" width="184" height="100" rx="6" fill="none" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M 203.5 114 L 211.5 120 L 203.5 126" fill="none" stroke="#5B7083" stroke-width="2" stroke-linecap="round"/>
  <path d="M 398.5 114 L 406.5 120 L 398.5 126" fill="none" stroke="#5B7083" stroke-width="2" stroke-linecap="round"/>
  <path d="M 593.5 114 L 601.5 120 L 593.5 126" fill="none" stroke="#5B7083" stroke-width="2" stroke-linecap="round"/>
  <path d="M 788.5 114 L 796.5 120 L 788.5 126" fill="none" stroke="#5B7083" stroke-width="2" stroke-linecap="round"/>
  <line x1="305" y1="166.0" x2="305" y2="200" stroke="#DAD6CC" stroke-width="1.5"/>
  <rect x="213" y="200" width="184" height="52" rx="4" fill="#E8EDF3" stroke="#DAD6CC" stroke-width="1"/>
  <text x="305.0" y="221.0" class="mono" font-size="12" fill="#7A8088" text-anchor="middle" font-weight="500" letter-spacing="0.08em">ALERT QUEUE</text>
  <text x="305.0" y="241.0" class="mono" font-size="12" fill="#1B1F24" text-anchor="middle" font-weight="400" >50 false : 1.6 true / h</text>
  <line x1="500" y1="166.0" x2="500" y2="200" stroke="#DAD6CC" stroke-width="1.5"/>
  <rect x="408" y="200" width="184" height="52" rx="4" fill="#E8EDF3" stroke="#DAD6CC" stroke-width="1"/>
  <text x="500.0" y="221.0" class="mono" font-size="12" fill="#7A8088" text-anchor="middle" font-weight="500" letter-spacing="0.08em">CUE</text>
  <text x="500.0" y="241.0" class="mono" font-size="12" fill="#1B1F24" text-anchor="middle" font-weight="400" >250 m error → 26 s search</text>
  <rect x="560" y="300" width="210" height="60" rx="4" fill="#FFFFFF" stroke="#A33A2B" stroke-width="1.25"/>
  <text x="665.0" y="324.0" class="mono" font-size="12" fill="#A33A2B" text-anchor="middle" font-weight="500" letter-spacing="0.08em">CONTACT LOST</text>
  <text x="665.0" y="345.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >r = v·t_gap,  A = πr²</text>
  <rect x="190" y="300" width="250" height="60" rx="4" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.25"/>
  <text x="315.0" y="324.0" class="mono" font-size="12" fill="#7A8088" text-anchor="middle" font-weight="500" letter-spacing="0.08em">RE-SEARCH</text>
  <text x="315.0" y="345.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >t ≈ −ln(1−POD)·A / (W·v)</text>
  <text x="500.0" y="410.0" class="sans" font-size="13" fill="#7A8088" text-anchor="middle" font-weight="400" >Double the gap and the area to re-search quadruples: 15 min at 20 kt is 78.5 NM², 30 min is 314 NM².</text>
  <text x="500.0" y="434.0" class="sans" font-size="13" fill="#7A8088" text-anchor="middle" font-weight="400" >Most of the value of a multi-sensor suite is created or lost in the cue and in the gaps.</text>
</svg>
